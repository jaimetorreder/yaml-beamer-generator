title: "Linear Functions Review"
author: "Math Teacher"
date: "2025-10-22"

slides:
  # Do Now - generates 2 slides (questions + answers)
  - type: do_now
    title: "Do Now"
    questions:
      - question: "Write the equation of a circle with center (3, -2) and radius 5."
        answer: "$(x - 3)^2 + (y + 2)^2 = 25$"
      - question: "Solve: $\\sqrt{x + 5} = 4$"
        answer: "$x = 11$"
      - question: "Solve: $|2x - 3| = 7$"
        answer: "$x = 5$ or $x = -2$"
      - question: "Evaluate $4x - 3y$ when $x = 0$ and $y = 2$."
        answer: "$-6$"

  # Learning Goals
  - type: learning_goals
    title: "Today's Focus"
    goals:
      - "Find x- and y-intercepts algebraically and graph lines"
      - "Calculate slope from graphs, equations, or two points"
      - "Write equations of lines using point-slope and slope-intercept forms"

  # Diagnostic Question 1
  - type: diagnostic_question
    title: "Diagnostic: Substitution"
    question: "Evaluate the expression $3x - 4y$ when $x = 2$ and $y = 0$."
    options:
      - "-8"
      - "6"
      - "-2"
      - "2"
    correct: 1

  # Diagnostic Question 2
  - type: diagnostic_question
    title: "Diagnostic: Substitution"
    question: "Evaluate the expression $2a + 5b$ when $a = 0$ and $b = 3$."
    options:
      - "15"
      - "5"
      - "8"
      - "0"
    correct: 0
    explanation: "Substitute: $2(0) + 5(3) = 0 + 15 = 15$"

  # Diagnostic Question 3
  - type: diagnostic_question
    title: "Diagnostic: Solving Equations"
    question: "Solve for $x$: $3x = 12$"
    options:
      - "$x = 9$"
      - "$x = 36$"
      - "$x = 4$"
      - "$x = 15$"
    correct: 2
